[package]
name = "spm-ocr"
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["Vadym Stupakov <vadim.stupakov@gmail.com>"]
description = "Train a SentencePiece tokenizer for multilingual OCR with preprocessing and validation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
