[package]
name = "spm-ocr"
version = "0.4.15"
edition = "2021"
license = "MIT"
authors = ["Vadym Stupakov <vadim.stupakov@gmail.com>"]
description = "Train a SentencePiece tokenizer for multilingual OCR with preprocessing and validation"

[dependencies]
anyhow = "1"
blake3 = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ignore = "0.4"
infer = "0.16"
indicatif = "0.17"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tar = "0.4"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-script = "0.5"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
