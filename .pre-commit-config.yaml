# Run with `uvx prek run --all-files`; install with `uvx prek install`.
# All hooks are local: they run the tools pinned in this project's dev deps,
# so the hook versions never drift from `uv run`.
repos:
  - repo: local
    hooks:
      # Ruff format — passes staged files as args
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

      # Ruff lint with autofix
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      # Pyrefly type check — runs over the configured includes, not per-file
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
