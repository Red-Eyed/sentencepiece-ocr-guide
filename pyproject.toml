[project]
name = "spm-ocr"
version = "0.4.20"
description = "Train a SentencePiece tokenizer for multilingual OCR with preprocessing and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
dependencies = [
    "pydantic>=2.7,<3",
    "sentencepiece>=0.2.3",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
sentencepiece = ["cmake"]

[tool.uv.sources]
sentencepiece = { git = "https://github.com/google/sentencepiece.git", subdirectory = "python", rev = "master" }

[dependency-groups]
dev = [
    "cmake>=4.4.4",
]
