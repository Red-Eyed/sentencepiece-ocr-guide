[project]
name = "sentencepiece-ocr-guide"
version = "0.1.0"
description = "Designing and training a SentencePiece tokenizer for multilingual OCR with math/LaTeX"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }]
license = "MIT"
dependencies = [
    "pydantic-settings>=2.14.2",
    "sentencepiece>=0.2.2",
    "tqdm>=4.67",
]

[project.scripts]
spm-ocr = "sentencepiece_ocr_guide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentencepiece_ocr_guide"]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyrefly]
python-version = "3.14.0"
# Point at the uv venv so pyrefly finds installed packages
python-interpreter-path = ".venv/bin/python"
project-includes = ["sentencepiece_ocr_guide", "tests"]
# Do not infer types from first-use (stricter)
infer-with-first-use = false

[tool.pytest.ini_options]
testpaths = ["tests"]
